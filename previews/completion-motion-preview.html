<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>完成事项动效预览</title>
    <style>
      :root {
        --bg: #f4f2ed;
        --ink: #1e2521;
        --muted: #6f776f;
        --line: #dfddd3;
        --surface: #fffefa;
        --teal: #0e746b;
        --green: #36724d;
        --green-soft: #e4f1e8;
        --shadow: 0 18px 42px rgba(46, 44, 37, 0.1);
        --ease-pop: cubic-bezier(0.18, 1.35, 0.32, 1);
        --ease-collapse: cubic-bezier(0.22, 0.76, 0.24, 1);
        font-family: "Aptos", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(90deg, rgba(30, 37, 33, 0.035) 1px, transparent 1px),
          linear-gradient(rgba(30, 37, 33, 0.035) 1px, transparent 1px),
          var(--bg);
        background-size: 28px 28px;
        color: var(--ink);
      }

      .stage {
        width: min(760px, calc(100vw - 32px));
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0 0 5px;
        font-size: clamp(1.9rem, 4vw, 3.4rem);
        line-height: 0.98;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-weight: 800;
      }

      button {
        font: inherit;
      }

      .replay {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--teal);
        font-weight: 900;
        cursor: pointer;
      }

      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 254, 250, 0.94);
        box-shadow: var(--shadow);
      }

      .head,
      .task {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) 130px;
        align-items: center;
      }

      .head {
        min-height: 42px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: #f8f6ef;
        color: #9aa197;
        font-size: 0.76rem;
        font-weight: 900;
      }

      .list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task-shell {
        height: 76px;
        opacity: 1;
        transform-origin: 50% 50%;
      }

      .task-shell.is-completing {
        animation: shell-collapse 0.46s 0.34s var(--ease-collapse) forwards;
      }

      .task {
        height: 76px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 254, 250, 0.76);
        overflow: hidden;
      }

      .task-shell:last-child .task {
        border-bottom: 0;
      }

      .task-shell.is-completing .task {
        animation: card-shrink 0.46s 0.34s var(--ease-collapse) forwards;
      }

      .status {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        justify-self: center;
        position: relative;
        border: 1px solid var(--teal);
        border-radius: 6px;
        background: var(--surface);
        color: white;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(14, 116, 107, 0.18);
      }

      .status::before {
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: var(--green);
        content: "";
        opacity: 0;
        transform: scale(0.72);
      }

      .status::after {
        width: 13px;
        height: 8px;
        position: relative;
        z-index: 1;
        border-left: 3px solid currentColor;
        border-bottom: 3px solid currentColor;
        content: "";
        opacity: 0;
        transform: rotate(-45deg) scale(0.4) translateY(-2px);
        transform-origin: 35% 70%;
      }

      .task-shell.is-completing .status::before {
        animation: circle-fill 0.22s var(--ease-pop) forwards;
      }

      .task-shell.is-completing .status::after {
        animation: check-pop 0.34s 0.1s var(--ease-pop) forwards;
      }

      .content {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .title {
        overflow-wrap: anywhere;
        font-weight: 900;
      }

      .date {
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 700;
      }

      .badge {
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        justify-self: center;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 0.8rem;
        font-weight: 900;
        white-space: nowrap;
      }

      @keyframes circle-fill {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        68% {
          opacity: 1;
          transform: scale(1.12);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes check-pop {
        0% {
          opacity: 0;
          transform: rotate(-45deg) scale(0.35) translateY(-2px);
        }

        62% {
          opacity: 1;
          transform: rotate(-45deg) scale(1.18) translateY(0);
        }

        100% {
          opacity: 1;
          transform: rotate(-45deg) scale(1) translateY(0);
        }
      }

      @keyframes card-shrink {
        0% {
          opacity: 1;
          transform: scale(1) translateX(0);
        }

        52% {
          opacity: 0.72;
          transform: scale(0.96) translateX(8px);
        }

        100% {
          opacity: 0;
          transform: scale(0.84) translateX(28px);
        }
      }

      @keyframes shell-collapse {
        0% {
          height: 76px;
        }

        100% {
          height: 0;
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="topbar">
        <div>
          <h1>完成动效预览</h1>
          <p>点击第一条左侧圆圈，观察确认勾和卡片收起补位。</p>
        </div>
        <button class="replay" type="button">重播</button>
      </div>

      <section class="panel">
        <div class="head">
          <span>状态</span>
          <span>事项</span>
          <span>期限</span>
        </div>
        <ul class="list"></ul>
      </section>
    </main>

    <script>
      const tasks = [
        ["整理本周采购清单", "截止：5月19日", "今天截止"],
        ["确认健身计划打卡", "截止：5月20日", "还剩 1 天"],
        ["补充项目备注", "截止：5月22日", "还剩 3 天"],
        ["整理桌面文件", "截止：5月25日", "还剩 6 天"],
      ];

      const list = document.querySelector(".list");

      function render() {
        list.innerHTML = tasks
          .map(
            (task, index) => `
              <li class="task-shell">
                <article class="task">
                  <button class="status" type="button" aria-label="标记完成"${index === 0 ? "" : " tabindex='-1'"}></button>
                  <div class="content">
                    <span class="title">${task[0]}</span>
                    <span class="date">${task[1]}</span>
                  </div>
                  <span class="badge">${task[2]}</span>
                </article>
              </li>
            `,
          )
          .join("");

        list.querySelector(".status").addEventListener("click", completeFirst);
      }

      function completeFirst() {
        const first = list.querySelector(".task-shell");
        if (!first || first.classList.contains("is-completing")) {
          return;
        }
        first.classList.add("is-completing");
      }

      document.querySelector(".replay").addEventListener("click", () => {
        render();
        window.setTimeout(completeFirst, 320);
      });

      render();
      window.setTimeout(completeFirst, 520);
    </script>
  </body>
</html>
